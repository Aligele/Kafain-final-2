<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kafa!n and Co — POS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    color: #f4f1ea;
    min-height: 100vh;
    background-color: #1c1410;
    background-image:
      linear-gradient(180deg, rgba(20,14,9,0.78), rgba(20,14,9,0.90)),
      url('https://raw.githubusercontent.com/Aligele/kafain-pos/main/cafe-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  a { color: #d8b26a; }
  header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .whoami { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  header select { padding: 6px 10px; border-radius: 6px; border: none; }
  .wrap { display: flex; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
  .products { flex: 2; min-width: 280px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; }
  .glass { background: rgba(30,22,16,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.10); }
  .card { border-radius: 10px; padding: 14px; cursor: pointer; transition: transform .12s, background .12s; }
  .card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.10); }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .price { color: #d8b26a; font-size: 13px; margin-top: 4px; }
  .card .stock { color: #b8ab98; font-size: 11px; margin-top: 4px; }
  .cart { flex: 1; border-radius: 10px; padding: 16px; min-width: 260px; height: fit-content; }
  .cart h2 { font-size: 15px; margin: 0 0 12px; }
  .line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .totals { margin-top: 12px; font-size: 14px; }
  .totals .row { display: flex; justify-content: space-between; margin-top: 4px; }
  .totals .grand { font-weight: 700; font-size: 16px; margin-top: 8px; }
  select, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); font-size: 14px; background: rgba(255,255,255,0.06); color: #f4f1ea; }
  button.primary { background: #d8b26a; color: #241a10; border: none; cursor: pointer; font-weight: 600; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: rgba(255,255,255,0.06); color: #f4f1ea; cursor: pointer; }
  .msg { font-size: 13px; margin-top: 8px; padding: 8px; border-radius: 6px; }
  .msg.ok { background: rgba(70,150,90,0.25); color: #b6e6c2; }
  .msg.err { background: rgba(180,60,60,0.25); color: #f3b8b8; }
  .mytickets { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; }
  .mytickets h3 { font-size: 14px; }
  .ticket { border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .backlink { font-size: 12px; opacity: 0.8; }

  #receiptOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; align-items:center; justify-content:center; }
  #receipt { background:#fff; color:#111; width:300px; padding:20px; border-radius:6px; font-family: 'Courier New', monospace; font-size:13px; }
  #receipt h2 { text-align:center; margin:0 0 4px; font-size:16px; }
  #receipt .center { text-align:center; }
  #receipt table { width:100%; border-collapse:collapse; margin:10px 0; }
  #receipt td { padding:2px 0; font-size:12px; }
  #receipt hr { border:none; border-top:1px dashed #999; margin:8px 0; }
  #receiptActions { display:flex; gap:8px; margin-top:14px; }
  #receiptActions button { width:auto; flex:1; padding:8px; }
  @media print {
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt { position: absolute; top: 0; left: 0; width: 280px; }
    #receiptActions { display: none; }
    #receiptOverlay { background: none; position: static; }
  }

  button, .card, a.role, .ticket { transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
  button:active, .card:active { transform: scale(0.96); }
  a.role:active { transform: scale(0.98); }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  @keyframes popIn { 0% { opacity:0; transform: scale(0.9) translateY(6px); } 100% { opacity:1; transform: scale(1) translateY(0); } }
  @keyframes toastSlide { 0% { opacity:0; transform: translateY(-8px); } 100% { opacity:1; transform: translateY(0); } }
  .msg { animation: toastSlide .25s ease; }
  .msg.ok { box-shadow: 0 0 0 1px rgba(70,150,90,0.4); }
  .checkmark { width:56px; height:56px; border-radius:50%; background:rgba(70,150,90,0.25); display:flex; align-items:center; justify-content:center; margin:0 auto 10px; animation: popIn .35s ease; }
  .checkmark svg { width:28px; height:28px; }
</style>
</head>
<body>
<header>
  <h1>Kafa!n and Co — Counter POS <a class="backlink" href="/">· Home</a></h1>
  <div class="whoami">
    <span>Serving as</span>
    <select id="employee"></select>
  </div>
</header>
<div class="wrap">
  <div class="products" id="products"></div>
  <div class="cart glass">
    <h2>Current order</h2>
    <div id="lines"></div>
    <div class="totals">
      <div class="row"><span>Subtotal</span><span id="subtotal">KSh 0.00</span></div>
      <div class="row grand"><span>Total</span><span id="total">KSh 0.00</span></div>
    </div>
    <button class="primary" id="checkout" disabled>Send order to finance</button>
    <div id="msg"></div>
  </div>
</div>
<div class="mytickets" style="max-width:1100px;margin:0 auto;padding:0 16px;">
  <a class="backlink" href="/finance">💰 Finance — confirm payments</a>
</div>
<div class="mytickets">
  <h3>My tickets today</h3>
  <div id="myTickets"></div>
</div>

<div id="receiptOverlay">
  <div>
    <div id="receipt"></div>
    <div id="receiptActions">
      <button class="secondary" id="btPrintBtn">📶 Bluetooth print</button>
      <button class="secondary" id="printBtn">🖨️ Print</button>
      <button class="secondary" id="closeReceiptBtn">Close</button>
    </div>
    <div id="btMsg" class="msg" style="display:none;"></div>
  </div>
</div>

<script>
let products = [];
let employees = [];
let cart = [];

async function loadEmployees() {
  const res = await fetch('/api/employees');
  employees = await res.json();
  const sel = document.getElementById('employee');
  sel.innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  const saved = localStorage.getItem('kafain_employee_id');
  if (saved && employees.some(e => String(e.id) === saved)) sel.value = saved;
  sel.addEventListener('change', () => {
    localStorage.setItem('kafain_employee_id', sel.value);
    loadMyTickets();
  });
  if (sel.value) localStorage.setItem('kafain_employee_id', sel.value);
  loadMyTickets();
}

async function loadProducts() {
  const res = await fetch('/api/products');
  products = await res.json();
  renderProducts();
}

function renderProducts() {
  const el = document.getElementById('products');
  el.innerHTML = products.map(p => `
    <div class="card glass" data-id="${p.id}">
      <div class="name">${p.name}</div>
      <div class="price">KSh ${p.price.toFixed(2)}</div>
      <div class="stock">${p.grams_per_unit ? Math.floor(p.stock_grams / p.grams_per_unit) + ' in stock' : ''}</div>
    </div>
  `).join('');
  el.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => addToCart(Number(card.dataset.id)));
  });
}

function addToCart(productId) {
  const existing = cart.find(i => i.product_id === productId);
  if (existing) existing.quantity += 1;
  else cart.push({ product_id: productId, quantity: 1 });
  renderCart();
}

function renderCart() {
  const linesEl = document.getElementById('lines');
  let subtotal = 0;
  linesEl.innerHTML = cart.map(item => {
    const p = products.find(pr => pr.id === item.product_id);
    const lineTotal = p.price * item.quantity;
    subtotal += lineTotal;
    return `<div class="line"><span>${item.quantity}x ${p.name}</span><span>KSh ${lineTotal.toFixed(2)}</span></div>`;
  }).join('');
  document.getElementById('subtotal').textContent = 'KSh ' + subtotal.toFixed(2);
  document.getElementById('total').textContent = 'KSh ' + subtotal.toFixed(2);
  document.getElementById('checkout').disabled = cart.length === 0;
}

async function loadMyTickets() {
  const employeeId = document.getElementById('employee').value;
  const el = document.getElementById('myTickets');
  if (!employeeId) { el.innerHTML = ''; return; }
  const res = await fetch('/api/my-orders?employee_id=' + employeeId);
  const orders = await res.json();
  if (!Array.isArray(orders) || orders.length === 0) {
    el.innerHTML = '<div style="font-size:13px;color:#b8ab98;">No tickets yet today.</div>';
    return;
  }
  el.innerHTML = orders.map(o => `
    <div class="ticket glass">
      <span>#${o.daily_number || o.id} · ${new Date(o.created_at).toLocaleTimeString()}</span>
      <span>KSh ${o.total.toFixed(2)}</span>
    </div>
  `).join('');
}

function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1175, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    o.start();
    o.stop(ctx.currentTime + 0.28);
  } catch (e) { /* audio not available, ignore */ }
}

function showReceipt(order) {
  playSuccessBeep();
  const empName = order.employee_name || document.querySelector('#employee option:checked')?.textContent || '';
  const rows = order.items.map(it => `
    <tr><td>${it.quantity}x ${it.name}</td><td style="text-align:right;">KSh ${it.line_total.toFixed(2)}</td></tr>
  `).join('');
  document.getElementById('receipt').innerHTML = `
    <div class="checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="#2f6f2f" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></div>
    <h2>KAFA!N AND CO</h2>
    <div class="center">Order #${order.daily_number}</div>
    <div class="center">${new Date(order.created_at).toLocaleString()}</div>
    <div class="center">Served by: ${empName}</div>
    <hr/>
    <table>${rows}</table>
    <hr/>
    <table>
      <tr><td>Subtotal</td><td style="text-align:right;">KSh ${order.subtotal.toFixed(2)}</td></tr>
      <tr><td>Tax</td><td style="text-align:right;">KSh ${order.tax.toFixed(2)}</td></tr>
      <tr><td><b>Total</b></td><td style="text-align:right;"><b>KSh ${order.total.toFixed(2)}</b></td></tr>
    </table>
    <div class="center" style="margin-top:10px;font-weight:bold;">⏳ Awaiting payment confirmation</div>
    <div class="center" style="font-size:11px;">Take this to Finance to confirm Cash or M-Pesa</div>
  `;
  window._lastOrder = order;
  document.getElementById('btMsg').style.display = 'none';
  document.getElementById('receiptOverlay').style.display = 'flex';
}

document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('closeReceiptBtn').addEventListener('click', () => {
  document.getElementById('receiptOverlay').style.display = 'none';
});

// --- Bluetooth thermal printer support (ESC/POS over BLE) ---
// Works with most generic 58mm/80mm Bluetooth thermal printers (common brands
// like Goojprt, generic "BT Printer" units). If your specific printer doesn't
// show up or fails to connect, use the regular Print button instead.
const PRINTER_SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
const PRINTER_CHAR = '00002af1-0000-1000-8000-00805f9b34fb';

function buildEscPosReceipt(order) {
  const enc = new TextEncoder();
  const empName = order.employee_name || document.querySelector('#employee option:checked')?.textContent || '';
  let lines = [];
  lines.push('\x1B\x40'); // init
  lines.push('\x1B\x61\x01'); // center
  lines.push('\x1B\x21\x30'); // double size
  lines.push('KAFA!N AND CO\n');
  lines.push('\x1B\x21\x00'); // normal size
  lines.push('Order #' + order.daily_number + '\n');
  lines.push(new Date(order.created_at).toLocaleString() + '\n');
  lines.push('Served by: ' + empName + '\n');
  lines.push('--------------------------------\n');
  lines.push('\x1B\x61\x00'); // left align
  order.items.forEach(it => {
    const left = `${it.quantity}x ${it.name}`;
    const right = 'KSh ' + it.line_total.toFixed(2);
    const pad = Math.max(1, 32 - left.length - right.length);
    lines.push(left + ' '.repeat(pad) + right + '\n');
  });
  lines.push('--------------------------------\n');
  lines.push(`Subtotal${' '.repeat(Math.max(1,24-('KSh '+order.subtotal.toFixed(2)).length))}KSh ${order.subtotal.toFixed(2)}\n`);
  lines.push(`Tax${' '.repeat(Math.max(1,29-('KSh '+order.tax.toFixed(2)).length))}KSh ${order.tax.toFixed(2)}\n`);
  lines.push('\x1B\x21\x10'); // bold-ish
  lines.push(`TOTAL${' '.repeat(Math.max(1,27-('KSh '+order.total.toFixed(2)).length))}KSh ${order.total.toFixed(2)}\n`);
  lines.push('\x1B\x21\x00');
  lines.push('\n\x1B\x61\x01');
  lines.push('AWAITING PAYMENT CONFIRMATION\n');
  lines.push('Take to Finance for Cash/M-Pesa\n');
  lines.push('\n\n\n');
  lines.push('\x1D\x56\x00'); // cut paper
  const text = lines.join('');
  return enc.encode(text);
}

document.getElementById('btPrintBtn').addEventListener('click', async () => {
  const btMsg = document.getElementById('btMsg');
  btMsg.style.display = 'block';
  if (!window._lastOrder) { btMsg.textContent = 'No order to print yet.'; btMsg.className = 'msg err'; return; }
  if (!navigator.bluetooth) {
    btMsg.textContent = 'Bluetooth printing needs Chrome on Android. Use Print instead.';
    btMsg.className = 'msg err';
    return;
  }
  try {
    btMsg.textContent = 'Choose your printer…';
    btMsg.className = 'msg';
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [PRINTER_SERVICE] }],
      optionalServices: [PRINTER_SERVICE],
    });
    btMsg.textContent = 'Connecting…';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(PRINTER_SERVICE);
    const characteristic = await service.getCharacteristic(PRINTER_CHAR);
    const data = buildEscPosReceipt(window._lastOrder);
    const chunkSize = 100;
    for (let i = 0; i < data.length; i += chunkSize) {
      await characteristic.writeValue(data.slice(i, i + chunkSize));
    }
    btMsg.textContent = '✅ Sent to printer';
    btMsg.className = 'msg ok';
  } catch (err) {
    btMsg.textContent = 'Could not print: ' + (err.message || 'printer not found. Use Print instead.');
    btMsg.className = 'msg err';
  }
});

document.getElementById('checkout').addEventListener('click', async () => {
  const btn = document.getElementById('checkout');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = '';
  msg.className = 'msg';
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: cart,
        channel: 'counter',
        employee_id: Number(document.getElementById('employee').value) || null,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Order failed');
    msg.textContent = 'Order #' + data.daily_number + ' sent to finance — KSh ' + data.total.toFixed(2);
    msg.className = 'msg ok';
    showReceipt(data);
    cart = [];
    renderCart();
    loadProducts();
    loadMyTickets();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg err';
    btn.disabled = false;
  }
});

loadEmployees();
loadProducts();
</script>
</body>
</html>
